[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "alembic>=1.20.1",
    "altcha==2.3.0",
    "asyncpg>=0.32.0",
    "cryptography>=46,<51",
    "fastapi>=0.162.0",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.9,<3",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
