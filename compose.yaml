name: invoice-keeper

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  backend:
    logging: *default-logging
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_keeper}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:${FRONTEND_PORT:-8080}","http://127.0.0.1:${FRONTEND_PORT:-8080}"]}'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  bot:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      # Validate the token at bot startup, so other services work without it.
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      TZ: ${APP_TIMEZONE:-Europe/Moscow}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        VITE_API_MODE: ${FRONTEND_API_MODE:-mock}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  postgres:
    logging: *default-logging
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_keeper}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_keeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores data in /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
