# docker compose -f compose.yaml -f compose.server.yaml up -d
services:
  frontend:
    ports: !reset []

  postgres:
    ports: !reset []

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the public IP or hostname}
      HTTPS_ALIASES: ${HTTPS_ALIASES:-}
      TLS_DEFAULT_NAME: ${TLS_DEFAULT_NAME:-${PUBLIC_HOST}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  caddy_data:
  caddy_config:
