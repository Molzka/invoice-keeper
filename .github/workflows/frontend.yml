name: Frontend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: invoice-keeper-frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_PORT: "0"
      FRONTEND_API_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compose validates the PostgreSQL settings even when only frontend starts.
      - name: Generate temporary Compose password
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Check types, lint and build frontend image
        run: docker compose --env-file .env.example build frontend

      - name: Start frontend
        run: docker compose --env-file .env.example up -d --no-deps --wait --wait-timeout 60 frontend

      - name: Check HTTP responses and runtime
        run: |
          address=$(docker compose --env-file .env.example port frontend 8080)
          python3 scripts/checks/check_frontend.py "http://$address"

          container=$(docker compose --env-file .env.example ps -q frontend)
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = "true"
          docker compose --env-file .env.example exec -T frontend sh -ec '
            test "$(id -u)" != "0"
            if command -v node || command -v npm; then
              echo "Build tools must not be installed in the runtime image" >&2
              exit 1
            fi
            test ! -d /usr/share/nginx/html/src
            test ! -e /usr/share/nginx/html/.env
          '
          echo "Frontend is healthy, non-root and read-only; build tools and sources are absent"

      - name: Show frontend logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=80 frontend

      - name: Remove temporary frontend
        if: always()
        run: |
          docker compose --env-file .env.example down --timeout 10
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
