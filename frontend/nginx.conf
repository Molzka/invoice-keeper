worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker DNS: resolve on requests so the demo starts without an API,
    # and a recreated backend container does not require restarting Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # The API streams receipt uploads with its own 5 MiB limit.
        client_max_body_size 6m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api(?:/|$) {
            set $api_upstream http://backend:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_next_upstream off;
            error_page 502 504 =503 @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"error":{"code":"API_NOT_AVAILABLE","message":"API временно недоступен.","details":[]}}';
        }

        location ~ /\. {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache";
        }
    }
}
